#Nations mod settings
[nations]
	#Fixed game rule: each player can found only one nation
	#(not configurable: the domain guarantees it)
	#Maximum number of chunks (16x16) a nation can claim
	# Default: 100
	# Range: 1 ~ 100000
	maxChunksPerNation = 4000
	#Maximum number of members per nation
	# Default: 20
	# Range: 1 ~ 1000
	maxNationMembers = 20
	#Minutes the defending nation has to answer a dispute
	#If it expires without a defense, the chunk changes owner
	# Default: 10
	# Range: 1 ~ 1440
	disputeWindowMinutes = 10
	#Minutes a nation must wait before opening a dispute again
	#Anti-abuse: 0 = no cooldown
	# Default: 30
	# Range: 0 ~ 10080
	disputeCooldownMinutes = 30
	#Minutes a chunk must wait before it can be disputed again
	#Anti-abuse: 0 = no cooldown
	# Default: 120
	# Range: 0 ~ 10080
	disputeChunkCooldownMinutes = 120
	#Defense window minutes when there is a WAR between the two nations
	#In war the window is shorter: that is the aggressor advantage
	# Default: 5
	# Range: 1 ~ 1440
	warDisputeWindowMinutes = 5
	#In war, the challenging nation does not have to wait for the dispute cooldown
	#Anti-abuse: the per chunk cooldown still applies
	warIgnoresDisputeCooldown = true
	#Chunks of minimum separation between the current claim and the capital
	#0 = no restriction
	# Default: 0
	# Range: 0 ~ 64
	minClaimDistance = 0

#Nations economy settings
[economy]
	#Enables daily income, garrison reinforcements and treasury interest
	economyEnabled = true
	#Coins a nation starts with
	# Default: 100
	# Range: 0 ~ 1000000
	startingBalance = 100
	#Coins generated by each claimed chunk per day
	# Default: 12
	# Range: 0 ~ 1000
	claimDailyIncome = 12
	#Coins it costs to open a dispute (deposit: not refunded)
	# Default: 50
	# Range: 0 ~ 100000
	attackCost = 50
	#Discount on the attack cost during a war (percentage)
	# Default: 50
	# Range: 0 ~ 100
	warAttackDiscountPercent = 50
	#Cost of buying each farm level (income x1.25)
	# Default: 100
	# Range: 0 ~ 1000000
	farmCost = 100
	#Cost of buying each garrison level (daily ground reinforcements)
	# Default: 150
	# Range: 0 ~ 1000000
	garrisonCost = 150
	#Cost of buying each treasury level (daily interest)
	# Default: 200
	# Range: 0 ~ 1000000
	treasuryCost = 200
	#Maximum level of each investment
	# Default: 3
	# Range: 1 ~ 10
	economyMaxLevel = 3
	#Coins per undeployed army
	# Default: 10
	# Range: 1 ~ 100000
	armyPrice = 10
	#Treasury coins per nuclear missile
	# Default: 1000000
	# Range: > 1
	nuclearMissilePrice = 1000000

#Map and minimap settings
[map]
	#Radius in chunks the server sends to the client to draw the map
	# Default: 16
	# Range: 1 ~ 256
	mapSyncRadiusChunks = 250
	#Maximum number of markers sent to the client minimap
	# Default: 300
	# Range: 1 ~ 10000
	mapMaxMarkers = 10000

#Claiming settings
[claims]
	#Allows claiming chunks. If disabled, the nations still exist
	claimsEnabled = true
	#Restricts the claims to the overworld
	overworldOnly = true
	#The territory of a nation must be contiguous: a chunk can only be
	#claimed when it is next to a chunk the nation already owns
	#(the first chunk of a nation must be next to its capital)
	#false = free claiming, anywhere in the world
	claimsMustBeContiguous = true

#Sale price per plain ingot or diamond, in whole coins
[market]
	# Default: 1
	# Range: 1 ~ 1000000
	ironIngot = 1
	# Default: 4
	# Range: 1 ~ 1000000
	goldIngot = 4
	# Default: 20
	# Range: 1 ~ 1000000
	diamond = 20
	# Default: 100
	# Range: 1 ~ 1000000
	netheriteIngot = 100

[petroleum]
	#Buckets per surveyed chunk per 24,000 server ticks
	# Default: 32
	# Range: 1 ~ 1000000
	exportBucketsPerDay = 32
	# Default: 8
	# Range: 1 ~ 1000000
	coinsPerCrudeBucket = 8
	# Default: 16
	# Range: 1 ~ 1000000
	coinsPerDieselBucket = 16
	# Default: 12
	# Range: 1 ~ 1000000
	coinsPerGasolineBucket = 12
